server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification-websocket/**

        - id: payment-soap-route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment-soap, /payment-soap/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/