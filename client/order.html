<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zamówienie - CoffeeShop</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #6f4e37; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #6f4e37; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #5a3e2b; }
        .status-box { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .status { font-size: 1.2em; font-weight: bold; color: #6f4e37; }
        #pay-btn { display: none; background: #28a745; }
        #pay-btn:hover { background: #218838; }
        .back { color: #6f4e37; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
<a href="index.html" class="back">← Wróć do katalogu</a>
<h1>☕ Zamówienie</h1>

<div id="form-section">
    <h2 id="product-name"></h2>
    <div class="form-group">
        <label>Ilość:</label>
        <input type="number" id="quantity" value="1" min="1">
    </div>
    <div class="form-group">
        <label>Imię:</label>
        <input type="text" id="customer-name" placeholder="Jan">
    </div>
    <button onclick="submitOrder()">Złóż zamówienie</button>
</div>

<div class="status-box" id="status-box" style="display:none">
    <p>Zamówienie #<span id="order-id"></span></p>
    <p>Status: <span class="status" id="order-status"></span></p>
    <button id="pay-btn" onclick="pay()">Zapłać</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="app.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('product-name').innerText = params.get('name') + ' - ' + params.get('price') + ' zł';

    let currentOrder = null;
    let stompClient = null;

    async function submitOrder() {
        const quantity = parseInt(document.getElementById('quantity').value);
        const customerName = document.getElementById('customer-name').value.trim();

        if (!customerName) {
            alert('Podaj imię!');
            return;
        }

        stompClient = connectWebSocket(customerName, async function(event) {
            console.log('WebSocket event:', event);
            document.getElementById('order-status').innerText = event.status;

            if (event.status === 'AWAITING_PAYMENT') {
                const res = await fetch(`${API_BASE}/orders/${event.orderId}`);
                const updatedOrder = await res.json();
                currentOrder = updatedOrder;

                if (updatedOrder._links && updatedOrder._links.pay) {
                    document.getElementById('pay-btn').style.display = 'block';
                }
            } else {
                document.getElementById('pay-btn').style.display = 'none';
            }
        });

        await new Promise(resolve => setTimeout(resolve, 1000));

        const order = await placeOrder(params.get('productId'), quantity, customerName);
        currentOrder = order;

        document.getElementById('form-section').style.display = 'none';
        document.getElementById('status-box').style.display = 'block';
        document.getElementById('order-id').innerText = order.id;
        document.getElementById('order-status').innerText = order.status;
    }

    async function pay() {
        const payLink = currentOrder._links.pay.href;
        const updated = await payForOrder(payLink);
        currentOrder = updated;
        document.getElementById('order-status').innerText = updated.status;
        document.getElementById('pay-btn').style.display = 'none';
    }
</script>
</body>
</html>
