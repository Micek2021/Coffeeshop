<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>CoffeeShop</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { color: #6f4e37; }
        .products { display: flex; flex-wrap: wrap; gap: 20px; }
        .product-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; width: 200px; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .product-card h3 { margin: 10px 0 5px; font-size: 14px;}
        .product-card p { color: #666; margin: 0 0 10px; }
        button { background: #6f4e37; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #5a3e2b; }
    </style>
</head>
<body>
<h1>☕ CoffeeShop</h1>
<div clasqs="products" id="products">Ładowanie produktów...</div>

<script src="app.js"></script>
<script>
    loadProducts().then(products => {
        const container = document.getElementById('products');
        container.innerHTML = '';
        products.forEach(p => {
            container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.imageUrl}" alt="${p.name}">                        <h3>${p.name}</h3>
                        <p>${p.price} zł</p>
                        <button onclick="window.location.href='order.html?productId=${p.id}&name=${encodeURIComponent(p.name)}&price=${p.price}'">
                            Zamów
                        </button>
                    </div>
                `;
        });
    });
</script>
</body>
</html>
